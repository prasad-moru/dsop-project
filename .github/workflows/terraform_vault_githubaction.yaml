name: vault-int-testing-pipeline

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: 'us-east-1'
  VAULT_ADDR: 'https://vault.devopsproduction.com'

jobs:
  vault-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 1 — debug OIDC token first (remove after confirmed working)
      - name: Debug OIDC Token
        run: |
          echo "=== Fetching OIDC Token ==="
          OIDC_TOKEN=$(curl -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://github.com/prasad-moru" \
            | jq -r '.value')
          
          if [ -z "$OIDC_TOKEN" ]; then
            echo "❌ Failed to get OIDC token"
            exit 1
          fi
          
          echo "✅ Got OIDC token"
          echo "=== Token Claims ==="
          echo $OIDC_TOKEN | cut -d. -f2 | base64 -d 2>/dev/null | jq .

      # Step 2 — fetch secrets from Vault
      - name: Import Secrets from Vault
        id: vault
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ env.VAULT_ADDR }}
          method: jwt
          role: github-actions
          jwtGithubAudience: "https://github.com/prasad-moru"
          secrets: |
            secret/data/aws/credentials access_key | AWS_ACCESS_KEY_ID ;
            secret/data/aws/credentials secret_key | AWS_SECRET_ACCESS_KEY

      # Step 3 — verify credentials loaded
      - name: Verify AWS Credentials
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "❌ AWS_ACCESS_KEY_ID not set"
            exit 1
          fi
          if [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "❌ AWS_SECRET_ACCESS_KEY not set"
            exit 1
          fi
          echo "✅ AWS credentials loaded from Vault"
          echo "Key starts with: ${AWS_ACCESS_KEY_ID:0:4}..."

      # Step 4 — verify AWS works with the credentials
      - name: Verify AWS Access
        run: |
          aws sts get-caller-identity
        env:
          AWS_ACCESS_KEY_ID:     ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION:            ${{ env.AWS_REGION }}

      # Step 5 — setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.11.3'

      # Step 6 — format check
      - name: Terraform Format Check
        working-directory: ./tf_vault_testing
        run: terraform fmt -check -recursive
        continue-on-error: true

      # Step 7 — init
      - name: Terraform Init
        working-directory: ./tf_vault_testing
        env:
          AWS_ACCESS_KEY_ID:     ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
        run: terraform init

      # Step 8 — validate
      - name: Terraform Validate
        working-directory: ./tf_vault_testing
        run: terraform validate -no-color

      # Step 9 — plan
      - name: Terraform Plan
        id: plan
        working-directory: ./tf_vault_testing
        env:
          AWS_ACCESS_KEY_ID:     ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION:            ${{ env.AWS_REGION }}
        run: |
          set -o pipefail
          terraform plan -no-color -out=tfplan 2>&1 | tee plan.txt
          echo "exitcode=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      # Step 10 — verify plan file
      - name: Check Plan File
        working-directory: ./tf_vault_testing
        run: |
          if [ -f tfplan ]; then
            echo "✅ tfplan exists"
            ls -lh tfplan
          else
            echo "❌ tfplan not found"
            exit 1
          fi

      # Step 11 — apply
      - name: Terraform Apply
        working-directory: ./tf_vault_testing
        env:
          AWS_ACCESS_KEY_ID:     ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION:            ${{ env.AWS_REGION }}
        run: terraform apply -auto-approve tfplan

      # Step 12 — output
      - name: Terraform Output
        if: success()
        working-directory: ./tf_vault_testing
        run: terraform output -json