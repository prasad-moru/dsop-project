name: dsop-order-service

on:
  workflow_dispatch: {}
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - 'src/ai-service/**'
  #     - '.github/workflows/ai-service.yaml'

env:
  SERVICE_NAME: dsop/order-service
  SERVICE_PATH: src/order-service
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  SONAR_HOST_URL: https://sonar.devopsproduction.com
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_OS }}


jobs:
  # ==========================================
  # JOB 1: SonarQube Code Analysis
  # ==========================================
  sonarqube-analysis:
    name: SonarQube Code Analysis
    runs-on: [self-hosted, dsop-runner]
    environment: dsop-project-dev

    outputs:
      version: ${{ steps.tag.outputs.version }}
      image_tag: ${{ steps.tag.outputs.image_tag }}
      short_sha: ${{ steps.tag.outputs.short_sha }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Generate Image Tag
        id: tag
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short=7 HEAD || echo "nosha")
          echo "🔍 Commit SHA: ${SHORT_SHA}"
          echo "Trigger event: ${{ github.event_name }}"

          echo "🔍 Querying ECR for latest tag of repository: ${{ env.SERVICE_NAME }}"
          LATEST_TAG=$(aws ecr describe-images \
            --repository-name "${{ env.SERVICE_NAME }}" \
            --region "${{ env.AWS_REGION }}" \
            --query 'sort_by(imageDetails,& imagePushedAt)[-1].imageTags[0]' \
            --output text 2>/dev/null || echo "")

          if [ -z "${LATEST_TAG}" ] || [ "${LATEST_TAG}" = "None" ] || [ "${LATEST_TAG}" = "null" ]; then
            echo "⚠️ No valid tag found in ECR. Starting base version 1.0.0"
            BASE_VERSION="1.0.0"
          else
            echo "🔎 Latest tag from ECR: ${LATEST_TAG}"
            if [[ ${LATEST_TAG} =~ ^([0-9]+\.[0-9]+\.[0-9]+)-.*$ ]]; then
              BASE_VERSION="${BASH_REMATCH[1]}"
            elif [[ ${LATEST_TAG} =~ ^([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              BASE_VERSION="${BASH_REMATCH[1]}"
            else
              echo "⚠️ Tag does not contain semantic version. Defaulting to 1.0.0"
              BASE_VERSION="1.0.0"
            fi
            echo "ℹ️ Base version: ${BASE_VERSION}"
          fi

          IFS='.' read -r major minor patch <<< "${BASE_VERSION}"
          major=${major:-1}
          minor=${minor:-0}
          patch=${patch:-0}
          NEXT_PATCH=$((patch + 1))
          VERSION="${major}.${minor}.${NEXT_PATCH}"
          IMAGE_TAG="${VERSION}-${SHORT_SHA}"

          echo "✅ Generated version: ${VERSION}"
          echo "✅ Image tag: ${IMAGE_TAG}"

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          echo "### 🏷️ Image Tag Generated" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Base version:** ${BASE_VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "**New version:** ${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit SHA:** ${SHORT_SHA}" >> $GITHUB_STEP_SUMMARY
          echo "**Full Tag:** ${IMAGE_TAG}" >> $GITHUB_STEP_SUMMARY

      - name: SonarQube Analysis
        working-directory: ${{ env.SERVICE_PATH }}
        run: |
          echo "🔍 Starting SonarQube analysis for AI Service..."
          sonar-scanner \
            -Dsonar.projectKey=order-service-app \
            -Dsonar.projectName="order-service-app" \
            -Dsonar.sources=. \
            -Dsonar.host.url=${{ env.SONAR_HOST_URL }} \
            -Dsonar.token=${{ env.SONAR_TOKEN_OS }} \
            -Dsonar.projectVersion=${{ steps.tag.outputs.version }}
            # -Dsonar.python.version=3.12 \
            # -Dsonar.scanner.skipJreProvisioning=true
          echo "✅ SonarQube analysis completed" >> $GITHUB_STEP_SUMMARY
          echo "### 🔍 SonarQube Analysis" >> $GITHUB_STEP_SUMMARY
          echo "**Project:** dsop-makeline-service" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.tag.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Dashboard:** ${{ env.SONAR_HOST_URL }}/dashboard?id=order-service-app" >> $GITHUB_STEP_SUMMARY

  # ==========================================
  # JOB 2: OWASP Dependency Check
  # ==========================================
  owasp-dependency-check:
    name: OWASP Dependency Check
    runs-on: [self-hosted, dsop-runner]
    environment: dsop-project-dev

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: OWASP Dependency Check
        working-directory: ${{ env.SERVICE_PATH }}
        run: |
          echo "🛡️ Running OWASP Dependency Check..."
          mkdir -p dependency-check-report

          if [ ! -f dependency-check-suppressions.xml ]; then
            cat > dependency-check-suppressions.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <suppressions xmlns="https://jeremylong.github.io/DependencyCheck/dependency-suppression.1.3.xsd">
          </suppressions>
          EOF
          fi

          dependency-check \
            --project "${{ env.SERVICE_NAME }}" \
            --scan . \
            --format ALL \
            --out ./dependency-check-report \
            --suppression ./dependency-check-suppressions.xml \
            --enableExperimental \
            --disableOssIndex \
            2>&1 | tee dependency-check.log || true

          echo "✅ OWASP Dependency Check completed" >> $GITHUB_STEP_SUMMARY

      - name: Upload OWASP Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-report-${{ github.run_number }}
          path: |
            ${{ env.SERVICE_PATH }}/dependency-check-report/
            ${{ env.SERVICE_PATH }}/dependency-check.log
          retention-days: 30

      - name: OWASP Report Summary
        if: always()
        run: |
          echo "### 🛡️ OWASP Dependency Check Report" >> $GITHUB_STEP_SUMMARY
          echo "Report artifact: \`owasp-dependency-report-${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY

  # ==========================================
  # JOB 3: Build, Scan, and Push to ECR
  # ==========================================
  build-scan-push:
    name: Build, Trivy Scan & Push to ECR
    runs-on: [self-hosted, dsop-runner]
    environment: dsop-project-dev
    needs: [sonarqube-analysis, owasp-dependency-check]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: |
          echo "🔐 Logging into ECR..."
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}
          echo "✅ ECR login successful"

      - name: Build Docker Image
        working-directory: ${{ env.SERVICE_PATH }}
        run: |
          echo "🐳 Building Docker image..."
          docker build \
            --no-cache \
            -t ${{ env.SERVICE_NAME }}:${{ needs.sonarqube-analysis.outputs.image_tag }} \
            --build-arg VERSION=${{ needs.sonarqube-analysis.outputs.version }} \
            --build-arg COMMIT_SHA=${{ needs.sonarqube-analysis.outputs.short_sha }} \
            --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
            .
          echo "✅ Docker image built" >> $GITHUB_STEP_SUMMARY
          echo "### 🐳 Docker Image Built" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker images | grep ${{ env.SERVICE_NAME }} >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Create Trivy Reports Directory
        run: mkdir -p trivy-reports

      - name: Trivy Scan - Table Format
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --format table \
            --output trivy-reports/trivy-report-table.txt \
            ${{ env.SERVICE_NAME }}:${{ needs.sonarqube-analysis.outputs.image_tag }} || true

      - name: Trivy Scan - JSON Format
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --format json \
            --output trivy-reports/trivy-report.json \
            ${{ env.SERVICE_NAME }}:${{ needs.sonarqube-analysis.outputs.image_tag }} || true

      - name: Trivy Scan - SARIF Format
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --format sarif \
            --output trivy-reports/trivy-report.sarif \
            ${{ env.SERVICE_NAME }}:${{ needs.sonarqube-analysis.outputs.image_tag }} || true

      - name: Display Trivy Results
        run: |
          echo "### 🔒 Trivy Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat trivy-reports/trivy-report-table.txt >> $GITHUB_STEP_SUMMARY || echo "No report generated" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Trivy Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-report-${{ needs.sonarqube-analysis.outputs.image_tag }}
          path: trivy-reports/
          retention-days: 30

      - name: Tag Docker Image for ECR
        run: |
          echo "🏷️ Tagging image for ECR..."
          docker tag \
            ${{ env.SERVICE_NAME }}:${{ needs.sonarqube-analysis.outputs.image_tag }} \
            ${{ env.ECR_REGISTRY }}/${{ env.SERVICE_NAME }}:${{ needs.sonarqube-analysis.outputs.image_tag }}

      - name: Push Image to ECR
        run: |
          echo "📤 Pushing image to ECR..."
          docker push ${{ env.ECR_REGISTRY }}/${{ env.SERVICE_NAME }}:${{ needs.sonarqube-analysis.outputs.image_tag }}
          echo "### 📤 Images Published to ECR" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** \`${{ env.ECR_REGISTRY }}/${{ env.SERVICE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ needs.sonarqube-analysis.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ needs.sonarqube-analysis.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`latest\`" >> $GITHUB_STEP_SUMMARY

      - name: Clean Up Local Docker Images
        if: always()
        run: |
          docker rmi ${{ env.SERVICE_NAME }}:${{ needs.sonarqube-analysis.outputs.image_tag }} 2>/dev/null || true
          docker rmi ${{ env.ECR_REGISTRY }}/${{ env.SERVICE_NAME }}:${{ needs.sonarqube-analysis.outputs.image_tag }} 2>/dev/null || true
          docker rmi ${{ env.ECR_REGISTRY }}/${{ env.SERVICE_NAME }}:${{ needs.sonarqube-analysis.outputs.version }} 2>/dev/null || true
          docker rmi ${{ env.ECR_REGISTRY }}/${{ env.SERVICE_NAME }}:latest 2>/dev/null || true
          docker image prune -f
          echo "✅ Cleanup completed"

      - name: Storage Summary
        if: always()
        run: |
          echo "### 🧹 Cleanup Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker images | grep ${{ env.SERVICE_NAME }} || echo "No local images - cleanup successful ✅"
          docker system df >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY