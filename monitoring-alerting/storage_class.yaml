apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer    # binds PVC to the AZ of the pod
reclaimPolicy: Retain                       # safer for production — no accidental deletion
allowVolumeExpansion: true                  # can resize without deleting PVC
parameters:
  type: gp3
  iops: "3000"          
  throughput: "125"     
  encrypted: "true"    