# helm-charts/virtual-worker/values.yaml
replicaCount: 1

image:
  repository: 357229909289.dkr.ecr.us-east-1.amazonaws.com/dsop/store-virtual-worker
  tag: "1.0.1-0d5bc20"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: "virtual-worker"

# No service needed - this is a background worker
service:
  enabled: false

# Standard Deployment - NO Argo Rollouts
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# No Istio needed for background worker
istio:
  enabled: false

# No HPA needed - fixed replica count
autoscaling:
  enabled: false

# Resource limits
resources:
  requests:
    cpu: 30m
    memory: 50Mi
  limits:
    cpu: 60m
    memory: 150Mi

# No probes - this is a background job
probes:
  enabled: false

# Environment variables
env:
  - name: MAKELINE_SERVICE_URL
    value: "http://makeline-service.application.svc.cluster.local:3001"
  - name: ORDERS_PER_HOUR
    value: "100"

# Vault Configuration - DISABLED (no secrets needed)
vault:
  enabled: false

# Datadog Configuration
# Uses OpenTelemetry SDK — traces sent to Datadog Agent OTLP receiver on port 4318
datadog:
  enabled: true
  env: production
  service: virtual-worker
  logs:
    enabled: true
  apm:
    enabled: true
  profiling:
    enabled: false

# Node selector
nodeSelector:
  kubernetes.io/os: linux

tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}