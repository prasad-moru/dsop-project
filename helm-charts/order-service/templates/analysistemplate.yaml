{{- if .Values.analysis.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ include "order-service.fullname" . }}-analysis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "order-service.labels" . | nindent 4 }}
spec:
  metrics:
  {{- if eq .Values.analysis.provider "datadog" }}
  {{- range .Values.analysis.datadog.metrics }}
  - name: {{ .name }}
    interval: {{ .interval }}
    count: {{ .count }}
    failureLimit: {{ .failureLimit }}
    consecutiveErrorLimit: {{ .consecutiveErrorLimit | default 5 }}
    successCondition: {{ .successCondition | quote }}
    provider:
      datadog:
        secretRef:
          name: {{ $.Values.analysis.datadog.secretName }}
        query: {{ .query | quote }}
  {{- end }}
  {{- end }}
{{- end }}