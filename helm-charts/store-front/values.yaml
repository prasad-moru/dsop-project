# helm-charts/store-front/values.yaml
replicaCount: 1

image:
  repository: 357229909289.dkr.ecr.us-east-1.amazonaws.com/dsop/store-front
  tag: "1.0.2-a82b978"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: "store-front"

service:
  name: store-front
  type: ClusterIP
  port: 80
  targetPort: 8080

# ALB Ingress Configuration - For external traffic
ingress:
  enabled: true
  annotations:
    # Additional custom annotations if needed
    alb.ingress.kubernetes.io/tags: Environment=production,Team=platform
  hosts:
    - host: "www.devopsproduction.com"  # Leave empty for ALB-generated DNS, or add custom domain
      paths:
        - path: /
          pathType: Prefix

  tls:
    - secretName: store-front-tls
      hosts:
        - www.devopsproduction.com
  alb:
    scheme: internet-facing
    targetType: ip
    certificateArn: arn:aws:acm:us-east-1:357229909289:certificate/7d123239-4cc6-40a0-9ead-a0320842518e

# Argo Rollouts Strategy - BLUE-GREEN
strategy:
  type: blueGreen
  blueGreen:
    activeService: store-front
    previewService: store-front-preview
    autoPromotionEnabled: true
    autoPromotionSeconds: 300
    scaleDownDelaySeconds: 300
    prePromotionAnalysis:
      templates:
        - templateName: store-front-analysis
    postPromotionAnalysis:
      templates:
        - templateName: store-front-analysis

# Istio Configuration
istio:
  enabled: true
  gateway:
    enabled: false
    name: store-gateway
    hosts:
      - "*"
  virtualService:
    enabled: true
    hosts:
      - store-front
      - store-front.application.svc.cluster.local
  destinationRule:
    enabled: true

# HPA Configuration
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 2
          periodSeconds: 15
      selectPolicy: Max
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 1
          periodSeconds: 15
      selectPolicy: Max

# Resource limits
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

# Probes
probes:
  startup:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 5
    failureThreshold: 3
    periodSeconds: 5
  readiness:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 3
    failureThreshold: 3
    periodSeconds: 5
  liveness:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 3
    failureThreshold: 5
    periodSeconds: 3

# Environment variables
# Note: VITE_* vars are baked into the build at CI time via --build-arg
# Runtime env vars (service URLs) are passed here for nginx config generation
env:
  - name: APP_VERSION
    value: "{{ .Values.image.tag }}"
# Init containers
initContainers:
  - name: wait-for-order-service
    image: busybox:1.36
    command:
      - 'sh'
      - '-c'
      - 'until nc -zv order-service.application.svc.cluster.local 3000; do echo waiting for order-service; sleep 2; done;'
    resources:
      requests:
        cpu: 1m
        memory: 50Mi
      limits:
        cpu: 100m
        memory: 256Mi
  - name: wait-for-product-service
    image: busybox:1.36
    command:
      - 'sh'
      - '-c'
      - 'until nc -zv product-service.application.svc.cluster.local 3002; do echo waiting for product-service; sleep 2; done;'
    resources:
      requests:
        cpu: 1m
        memory: 50Mi
      limits:
        cpu: 100m
        memory: 256Mi

# Vault - DISABLED (RUM keys injected at build time via GitHub Actions + Vault JWT)
vault:
  enabled: false

# Datadog Configuration
datadog:
  enabled: true
  site: "us5.datadoghq.com"
  env: production
  service: store-front
  logs:
    enabled: true
  apm:
    enabled: false   # RUM used for frontend — no server-side APM needed
  profiling:
    enabled: false

# Prometheus Metrics
metrics:
  enabled: false
  serviceMonitor:
    enabled: false

# Node selector
nodeSelector:
  kubernetes.io/os: linux

tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}

# Analysis Template Configuration
analysis:
  enabled: true
  provider: datadog
  datadog:
    secretName: datadog-secret
    metrics:
      - name: error-rate
        query: "avg:trace.http.request.errors{service:store-front,env:production}.as_rate()"
        successCondition: "default(result, 0) < 0.05"
        failureLimit: 3
        interval: 1m
        count: 5
      - name: p95-latency
        query: "avg:trace.http.request.duration.by.service.95p{service:store-front,env:production}"
        successCondition: "default(result, 0) < 2000"
        failureLimit: 3
        interval: 1m
        count: 5