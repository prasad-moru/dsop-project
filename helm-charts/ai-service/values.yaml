# helm-charts/ai-service/values.yaml
# Default values for ai-service

replicaCount: 1

image:
  repository: 357229909289.dkr.ecr.us-east-1.amazonaws.com/dsop/ai-service
  tag: "1.0.3-84163bf"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: "ai-service"

service:
  name: ai-service
  type: ClusterIP
  port: 5001
  targetPort: 5001

# Argo Rollouts Strategy
strategy:
  type: canary  # deployment strategy 
  canary:
    dynamicStableScale: true
    steps:
      - setWeight: 20
      - pause:
          duration: 30s
      - analysis:
          templates:
            - templateName: ai-service-analysis
      - setWeight: 40
      - pause:
          duration: 30s
      - analysis:
          templates:
            - templateName: ai-service-analysis
      - setWeight: 60
      - pause:
          duration: 30s
      - analysis:
          templates:
            - templateName: ai-service-analysis
      - setWeight: 80
      - pause:
          duration: 30s
      - analysis:
          templates:
            - templateName: ai-service-analysis
      - setWeight: 100
    trafficRouting:
      istio:
        virtualService:
          name: ai-service
          routes:
            - primary
    analysisInterval: 1m
    analysisSuccessCount: 2
    analysisFailureLimit: 3

# Istio Configuration
istio:
  enabled: true
  gateway:
    enabled: false
  virtualService:
    enabled: true
    hosts:
      - ai-service
    timeout: "120s"    # ← add this
  destinationRule:
    enabled: true

# HPA Configuration
autoscaling:
  enabled: true
  minReplicas: 4
  maxReplicas: 7
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 85
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 80
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 40
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30

# Resource limits
resources:
  requests:
    cpu: 200m
    memory: 150Mi
  limits:
    cpu: 400m
    memory: 300Mi

# Probes
probes:
  startup:
    httpGet:
      path: /health
      port: 5001
    initialDelaySeconds: 120
    failureThreshold: 30
    periodSeconds: 5
  readiness:
    httpGet:
      path: /health
      port: 5001
    initialDelaySeconds: 10
    failureThreshold: 10
    periodSeconds: 10
  liveness:
    httpGet:
      path: /health
      port: 5001
    initialDelaySeconds: 15
    failureThreshold: 10
    periodSeconds: 10

podAnnotations:
  traffic.sidecar.istio.io/excludeOutboundPorts: "8200,8201,443"
  proxy.istio.io/config: '{ "holdApplicationUntilProxyStarts": true }'   

# Environment variables
env:
  - name: USE_AZURE_OPENAI
    value: "False"
  - name: USE_AZURE_AD
    value: "False"
  - name: OPENAI_CHAT_MODEL
    value: "gpt-4o-mini"
  - name: OPENAI_IMAGE_MODEL
    value: "dall-e-3"

# Vault Configuration
vault:
  enabled: true
  address: "https://vault.devopsproduction.com"  # ← add this
  role: "ai-service"
  secrets:
    openai:
      path: "secret/data/ai-service"
      template: |
        {{- with secret "secret/data/ai-service" -}}
        export OPENAI_API_KEY="{{ .Data.data.openai_api_key }}"
        export OPENAI_ORG_ID="{{ .Data.data.openai_org_id }}"
        {{- end }}  

# Datadog Configuration
datadog:
  enabled: true
  env: production
  service: ai-service
  logs:
    enabled: true
  apm:
    enabled: true
    language: python  # python, nodejs, golang, java, etc.
  profiling:
    enabled: false

# Prometheus Metrics (Optional - for future use)
metrics:
  enabled: false  # Set to true if you add /metrics endpoint
  serviceMonitor:
    enabled: false
    interval: 30s
    path: /metrics

# Node selector
nodeSelector:
  kubernetes.io/os: linux

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Pod annotations
#podAnnotations: {}

# Pod labels
podLabels: {}

# Analysis Template Configuration
analysis:
  enabled: true
  provider: datadog
  datadog:
    secretName: datadog-secret  # Simplified - just the secret name
    metrics:
      - name: error-rate
        query: "avg:trace.http.request.errors{service:ai-service,env:production}.as_rate()"
        successCondition: "default(result, 0) < 0.05"  # Added default() for nil handling
        consecutiveErrorLimit: 5
        failureLimit: 3
        interval: 10s
        count: 3
      - name: p95-latency
        query: "avg:trace.http.request.duration.by.service.95p{service:ai-service,env:production}"
        successCondition: "default(result, 0) < 1000"  # Added default() for nil handling
        failureLimit: 3
        interval: 10s
        count: 3