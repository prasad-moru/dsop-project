server {
    listen       8081;
    listen  [::]:8081;
    server_name  localhost;

    # Health check endpoint
    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","version":"${APP_VERSION}"}';
    }

    # ── NEW API PREFIX ROUTES (Vite build uses these) ──

    # Product service - /api/products
    location ~ ^/api/products(/.*)?$ {
        rewrite ^/api/products/?(.*)$ /$1 break;
        proxy_pass http://product-service.application.svc.cluster.local:3002;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Makeline service - /api/makeline
    location ~ ^/api/makeline(/.*)?$ {
        rewrite ^/api/makeline/?(.*)$ /$1 break;
        proxy_pass http://makeline-service.application.svc.cluster.local:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Order service - /api/order
    location ~ ^/api/order(/.*)?$ {
        rewrite ^/api/order/?(.*)$ /$1 break;
        proxy_pass http://order-service.application.svc.cluster.local:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Product service - /api/product (singular - for POST create / PUT update)
    location ~ ^/api/product(/.*)?$ {
        rewrite ^/api/product/?(.*)$ /$1 break;
        proxy_pass http://product-service.application.svc.cluster.local:3002;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # AI service - /api/ai  ← CHANGED: increased timeouts for image generation
    location ~ ^/api/ai(/.*)?$ {
        rewrite ^/api/ai/?(.*)$ /$1 break;
        proxy_pass http://ai-service.application.svc.cluster.local:5001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── EXISTING ROUTES (keeping all original routes) ──

    # Makeline service routes
    location ~ ^/makeline/order/(?<id>\w+)$ {
        proxy_pass http://makeline-service.application.svc.cluster.local:3001/order/$id;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /makeline/order/fetch {
        proxy_pass http://makeline-service.application.svc.cluster.local:3001/order/fetch;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /makeline/order {
        proxy_pass http://makeline-service.application.svc.cluster.local:3001/order;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Order service routes
    location /order/ {
        proxy_pass http://order-service.application.svc.cluster.local:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Product service routes
    location ~ ^/product/(?<id>\w+)$ {
        proxy_pass http://product-service.application.svc.cluster.local:3002/$id;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /products/ {
        proxy_pass http://product-service.application.svc.cluster.local:3002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /products {
        proxy_pass http://product-service.application.svc.cluster.local:3002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /product/ {
        proxy_pass http://product-service.application.svc.cluster.local:3002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /product {
        proxy_pass http://product-service.application.svc.cluster.local:3002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # AI service routes
    location /ai/health {
        proxy_pass http://ai-service.application.svc.cluster.local:5001/ai/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ai/generate/description {
        proxy_pass http://ai-service.application.svc.cluster.local:5001/generate/description;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ← CHANGED: increased timeouts for dall-e-3 image generation
    location /ai/generate/image {
        proxy_pass http://ai-service.application.svc.cluster.local:5001/generate/image;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Vue.js SPA - MUST BE LAST
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}