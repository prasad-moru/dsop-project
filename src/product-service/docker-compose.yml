      - OPENAI_ORG_ID=org-MQENs1E0HzS2Bg6rgEc4jkR6     # ✅ already filled - good
      - OPENAI_IMAGE_MODEL=dall-e-3     # ✅ add this - change to gpt-image-1 in May
    networks:
      - backend_services
networks:
  backend_services:
    driver: bridge