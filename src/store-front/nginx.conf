server {
    listen       8080;
    listen  [::]:8080;
    server_name  localhost;

    # ── SPA Routing ──
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # ── Health Check ──
    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","version":"${APP_VERSION}"}';
    }

    # ── Product Service Proxy ──
    # rewrite strips /api/products prefix before forwarding
    # GET /api/products        → http://product-service.application.svc.cluster.local:3002/
    # GET /api/products/abc123 → http://product-service.application.svc.cluster.local:3002/abc123
    location /api/products {
        rewrite ^/api/products/?(.*)$ /$1 break;
        proxy_pass         http://product-service.application.svc.cluster.local:3002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # ── Order Service Proxy ──
    # GET /api/orders          → http://order-service.application.svc.cluster.local:3000/
    # GET /api/orders/xyz      → http://order-service.application.svc.cluster.local:3000/xyz
    location /api/orders {
        rewrite ^/api/orders/?(.*)$ /$1 break;
        proxy_pass         http://order-service.application.svc.cluster.local:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # ── Error Pages ──
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}