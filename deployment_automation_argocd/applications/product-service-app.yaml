apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: product-service
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: product-service=357229909289.dkr.ecr.us-east-1.amazonaws.com/dsop/product-service
    argocd-image-updater.argoproj.io/product-service.update-strategy: semver
    argocd-image-updater.argoproj.io/product-service.allow-tags: regexp:^[0-9]+\.[0-9]+\.[0-9]+-.+$
    argocd-image-updater.argoproj.io/product-service.ignore-tags: latest, dev, staging
    argocd-image-updater.argoproj.io/write-back-method: argocd
    notifications.argoproj.io/subscribe.on-sync-succeeded.slack: argocd-notifications
    notifications.argoproj.io/subscribe.on-sync-failed.slack: argocd-notifications
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: product-service
    app.kubernetes.io/part-of: store-app
spec:
  project: default
  source:
    repoURL: https://github.com/prasad-moru/dsop-project.git
    targetRevision: main
    path: helm-charts/product-service
    helm:
      releaseName: product-service
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: application
  ignoreDifferences:
    - group: argoproj.io
      kind: AnalysisTemplate
      jsonPointers:
        - /spec/metrics
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10